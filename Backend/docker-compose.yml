version: "3.9"

networks:
  web:
    driver: bridge

volumes:
  pg_data:

services:
  # ---------- PostgreSQL ----------
  db:
    image: postgres:16-alpine
    container_name: pg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_secret_change_me
      POSTGRES_DB: appdb
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - web
    # наружу порт НЕ публикуем — только внутри сети
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- API-прослойка ----------
  api:
    build: ./api
    container_name: app_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: app
      PGPASSWORD: app_secret_change_me
      PGDATABASE: appdb
      # ⚠️ в проде замени на длинную случайную строку (>= 64 символа)
      JWT_SECRET: "change-me-to-a-long-random-string-please-0123456789"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - web

  # ---------- Nginx ----------
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./site:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - web