worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # gzip — чтобы статика отдавалась быстрее
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Отдаём index.html по умолчанию
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Явные правила для статики (кэш + корректные MIME)
        location ~* \.(css|js)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Страница 404 — отдадим свой index (SPA-подход не нужен, но пусть будет)
        # error_page 404 /index.html;

        # Заготовка под проксирование API на будущий контейнер:
        # location /api/ {
        #     proxy_pass http://app:3000/;
        #     proxy_set_header Host              $host;
        #     proxy_set_header X-Real-IP         $remote_addr;
        #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
    }

    # Заготовка под HTTPS:
    # server {
    #     listen 443 ssl http2;
    #     server_name example.com;
    #     root /usr/share/nginx/html;
    #     index index.html;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     location / {
    #         try_files $uri $uri/ /index.html;
    #     }
    # }
}