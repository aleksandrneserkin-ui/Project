<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента — project 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">Logo</div>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="feed.html" class="active">Лента</a></li>
                <li><a href="placeholder.html">Профиль</a></li>
            </ul>
            
            <label class="theme-switch" title="Переключить тему">
                <input type="checkbox" id="theme-toggle" class="theme-switch-input">
                <span class="theme-switch-track" aria-hidden="true">
                    <span class="theme-switch-thumb">
                        <svg class="theme-switch-icon theme-switch-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4.5"/>
                            <path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                        </svg>
                        <svg class="theme-switch-icon theme-switch-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.5 6.5 0 0 0 9.7 9.7z"/>
                        </svg>
                    </span>
                </span>
            </label>
        </nav>
    </header>

    <main class="feed-main">
        <section class="feed-header">
            <h1 class="feed-title">Лента</h1>
            <p class="feed-subtitle">Свежие материалы сообщества</p>
        </section>

        <section class="feed-grid" id="feedGrid">
            <!-- Карточки добавляются скриптом -->
        </section>

        <div class="feed-sentinel" id="feedSentinel" aria-hidden="true"></div>

        <div class="feed-loader" id="feedLoader" hidden>
            <span class="feed-loader-dot"></span>
            <span class="feed-loader-dot"></span>
            <span class="feed-loader-dot"></span>
        </div>
    </main>

    <footer>
        project 2026
    </footer>

    <script src="feed.js"></script>
</body>
</html>
