<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница в разработке — project 2026</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
</head>
<body>

    <header>
        <nav>
            <div class="logo">Logo</div>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="feed.html">Лента</a></li>
                <li><a href="profile.html">Профиль</a></li>
            </ul>

            <label class="theme-switch" title="Переключить тему">
                <input type="checkbox" id="theme-toggle" class="theme-switch-input">
                <span class="theme-switch-track" aria-hidden="true">
                    <span class="theme-switch-thumb">
                        <svg class="theme-switch-icon theme-switch-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4.5"/>
                            <path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                        </svg>
                        <svg class="theme-switch-icon theme-switch-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.5 6.5 0 0 0 9.7 9.7z"/>
                        </svg>
                    </span>
                </span>
            </label>

            <button type="button" class="auth-btn" id="openAuth">Войти</button>

            <div class="user-badge" id="userBadge" hidden>
                <span class="user-name" id="userName"></span>
                <button type="button" class="logout-btn" id="logoutBtn">Выйти</button>
            </div>
        </nav>
    </header>

    <main class="placeholder-main">
        <section class="placeholder">
            <div class="placeholder-icon">⚙</div>
            <h1 class="placeholder-title">Страница ещё не создана</h1>
            <p class="placeholder-text">
                Мы активно работаем над этим разделом.<br>
                Совсем скоро здесь появится что-то интересное.
            </p>
            <a href="index.html" class="placeholder-btn">Вернуться на главную</a>
        </section>
    </main>

    <footer>
        project 2026
    </footer>

    <!-- Всплывающее окно авторизации -->
    <div class="modal-overlay" id="authModal" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
            <button type="button" class="modal-close" id="closeAuth" aria-label="Закрыть">&times;</button>

            <h2 class="modal-title" id="authTitle">Добро пожаловать</h2>

            <div class="modal-tabs">
                <button type="button" class="tab-btn active" data-tab="login">Вход</button>
                <button type="button" class="tab-btn" data-tab="register">Регистрация</button>
            </div>

            <!-- Форма входа -->
            <form class="modal-form active" id="formLogin" novalidate>
                <label class="field">
                    <span>Email</span>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </label>
                <label class="field">
                    <span>Пароль</span>
                    <input type="password" name="password" placeholder="••••••••" required>
                </label>
                <p class="form-error" id="loginError" hidden></p>
                <button type="submit" class="submit-btn">Войти</button>
            </form>

            <!-- Форма регистрации -->
            <form class="modal-form" id="formRegister" novalidate>
                <label class="field">
                    <span>Имя</span>
                    <input type="text" name="name" placeholder="Как вас зовут" required>
                </label>
                <label class="field">
                    <span>Email</span>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </label>
                <label class="field">
                    <span>Пароль</span>
                    <input type="password" name="password" placeholder="Минимум 6 символов" minlength="6" required>
                </label>
                <p class="form-error" id="registerError" hidden></p>
                <button type="submit" class="submit-btn">Создать аккаунт</button>
            </form>
        </div>
    </div>

    <!-- Тестовые данные (загружаются в localStorage) -->
    <script src="script.js"></script>
</body>
</html>
